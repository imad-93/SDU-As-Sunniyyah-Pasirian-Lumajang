<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>

    .btn{border:0;border-radius:10px;cursor:pointer;padding:10px 16px;font-weight:700;transition:.15s ease}
    .btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:#084d2a}
    .btn-ghost{background:white;border:1.5px solid var(--line);color:var(--text)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
    .btn-danger{background:#fdeceb;color:var(--danger);border:1.5px solid #f7d4d1}.btn-gold{background:var(--gold);color:#3d2e00}.btn-sm{padding:7px 10px;font-size:.75rem;border-radius:8px}.full{width:100%}
    .demo-box{background:var(--primary-soft);border:1px solid rgba(11,107,58,.08);border-radius:12px;padding:12px 14px;margin-top:18px}
    .demo-box strong{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:6px}
    .demo-row{display:flex;justify-content:space-between;font-size:.75rem;gap:12px;color:var(--text);padding:5px 0}.demo-row code{background:white;color:var(--primary);font-weight:700;border-radius:6px;padding:2px 7px}.demo-note{margin-top:12px;text-align:center;color:var(--muted);font-size:.72rem}

    .app{display:flex;min-height:100vh}.sidebar{width:250px;background:linear-gradient(180deg, var(--primary), #084d2a);color:#f2f9f4;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
    .brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:12px}
    .brand-mark{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}

    .nav{display:flex;flex-direction:column;gap:5px;flex:1}.nav-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:10px;background:transparent;color:inherit;padding:10px 12px;cursor:pointer;font-weight:600;font-size:.8rem}.nav-btn:hover{background:rgba(255,255,255,.08)}.nav-btn.active{background:white;color:var(--primary)}.nav-icon{width:18px;text-align:center}
    .sidebar-bottom{border-top:1px solid rgba(255,255,255,.18);padding-top:12px;margin-top:8px}
    .main{flex:1;min-width:0}.topbar{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;backdrop-filter:blur(6px)}

    .userbox{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:800;display:grid;place-items:center}.user-meta{display:flex;flex-direction:column}.user-name{font-size:.78rem;font-weight:700}.user-role{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .content-shell{padding:22px 24px 40px}.section-grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stat,.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .stat{padding:16px 18px;position:relative;overflow:hidden}.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--primary)}.stat.gold::before{background:var(--gold)}.stat.warn::before{background:var(--warn)}.stat.danger::before{background:var(--danger)}
    .stat-label{font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}.stat-value{margin-top:8px;font-size:clamp(1.5rem,2vw,2rem);font-weight:800;letter-spacing:-.04em}.stat-hint{margin-top:6px;font-size:.7rem;color:var(--muted)}
    .card{padding:18px 18px 12px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.card-head h3{margin:0;color:var(--primary);font-size:.98rem}.card-head p{margin:3px 0 0;color:var(--muted);font-size:.72rem}
    table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid #edf1ef;text-align:left}th{background:#f5f9f6;color:#375446;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}td{font-size:.77rem}tbody tr:hover{background:#fafdfb}.table-wrap{overflow-x:auto}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.7rem;font-weight:700}.pill.hadir{background:#e7f7ee;color:var(--success)}.pill.sakit{background:#fff0d5;color:#a36200}.pill.izin{background:#eaf0ff;color:#2b5bbd}.pill.alpa{background:#fdeceb;color:var(--danger)}.pill.late{background:#fff0d5;color:#9d6800}.pill.lunas{background:#e7f7ee;color:var(--success)}.pill.belum{background:#fdeceb;color:var(--danger)}
    .field{display:flex;flex-direction:column;gap:6px}.field label{margin:0}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
    .list{display:grid;gap:10px}.list-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #edf1ef;padding-bottom:8px}.list-item:last-child{border-bottom:none;padding-bottom:0}.list-title{font-weight:700}.list-meta{color:var(--muted);font-size:.7rem;margin-top:3px}.empty{text-align:center;color:var(--muted);padding:30px 12px;font-size:.78rem}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.space-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;padding:4px 8px;border-radius:999px;font-size:.68rem;font-weight:800;background:var(--primary-soft);color:var(--primary)}

    .toast{position:fixed;right:18px;bottom:18px;background:var(--primary);color:white;border-radius:12px;box-shadow:0 12px 28px rgba(11,107,58,.25);padding:11px 16px;font-size:.8rem;font-weight:700;z-index:999;animation:fadeUp .25s ease}.toast.err{background:var(--danger)} @keyframes fadeUp{from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)}}
    @media (max-width:900px){.app{display:block}.sidebar{width:100%;height:auto;position:static;padding:12px}.nav{flex-direction:row;flex-wrap:wrap}.nav-btn{width:auto;flex:1 1 auto}.topbar{padding:12px 14px}.content-shell{padding:16px 14px 26px}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2{grid-template-columns:1fr}} @media (max-width:560px){.grid-4{grid-template-columns:1fr}.login-card{padding:24px 18px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const STORAGE_KEY='assunniyyah_demo_db_v3';
    const SESSION_KEY='assunniyyah_demo_session';
    const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
    const uid=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
    const pad=n=>String(n).padStart(2,'0');
    const today=()=>{const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
    const dayBack=n=>{const d=new Date(); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
    const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
    const fmtDate=s=>{if(!s)return'-'; const d=new Date(`${s}T00:00:00`); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});};
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    const safeParse=(raw,fallback)=>{try{return raw?JSON.parse(raw):fallback}catch{return fallback;}};
    const statusClass=(status)=>{const map={Hadir:'hadir',Sakit:'sakit',Izin:'izin',Alpa:'alpa',Terlambat:'late',Lunas:'lunas','Belum Lunas':'belum'}; return map[status]||'hadir';};

    function loadDb(){
      const base={
        siswa:[
          {id:'s1',nis:'2425001',nama:'Ahmad Fauzan',kelas:'1A',ortu:'Bapak Hasan',kontak:'0812-0001',alamat:'Jl. Tegir RT 01 RW 02',foto:'',ttl:'2017-03-12'},
          {id:'s2',nis:'2425002',nama:'Aisyah Nur Fadhilah',kelas:'1A',ortu:'Bapak Rahman',kontak:'0812-0002',alamat:'Jl. Merdeka',foto:'',ttl:'2017-03-15'},
          {id:'s3',nis:'2425003',nama:'Bilal Ramadhan',kelas:'1A',ortu:'Bapak Yusuf',kontak:'0812-0003',alamat:'Jl. Mawar',foto:'',ttl:'2017-04-02'},
          {id:'s4',nis:'2425004',nama:'Citra Aulia',kelas:'1A',ortu:'Bapak Ibrahim',kontak:'0812-0004',alamat:'Jl. Raya Pasirian',foto:'',ttl:'2017-02-18'},
          {id:'s5',nis:'2425005',nama:'Dimas Prayoga',kelas:'2A',ortu:'Bapak Soleh',kontak:'0812-0005',alamat:'Jl. Nusa Indah',foto:'',ttl:'2016-07-07'},
        ],
        guru:[
          {id:'g1',nama:'Ustadzah Nur Aisyah',mapel:'Guru Kelas 1A',kontak:'0813-1001',status:'Aktif'},

          {id:'k4',nama:'4A',waliKelas:'Ustadz Rizal Hakim',kapasitas:32}
        ],
        mapel:[
          {id:'m1',nama:"Al-Qur'an (Tahfidz)",kelompok:'Akademik'},
          {id:'m2',nama:'Pendidikan Agama Islam',kelompok:'Akademik'},
          {id:'m3',nama:'Bahasa Indonesia',kelompok:'Akademik'},
          {id:'m4',nama:'Matematika',kelompok:'Akademik'},

          {id:'j4',kelas:'2A',hari:'Senin',jam:'07:00-07:35',mapel:'Matematika',guruId:'g2'}

        produk:[
          {id:'p1',kode:'BRG-001',nama:'Nasi Ayam',harga:10000,stok:50},

          {id:'p4',kode:'BRG-004',nama:'Air Mineral',harga:3000,stok:100},
          {id:'p5',kode:'BRG-005',nama:'Es Teh',harga:3000,stok:80}
        ],
        absensiSiswa:[],
        absensiGuru:[],
        absensiMapel:[],
        pembayaran:[],

        settings:{limitHarian:20000, schoolName:'SD Program Unggulan Assunniyyah', notifMode:'WhatsApp', version:3}
      };
      const saved=safeParse(localStorage.getItem(STORAGE_KEY), null);
      const db=saved&&typeof saved==='object'?saved:base;
      const merged={...base,...db};
      merged.siswa=Array.isArray(db.siswa)?db.siswa:base.siswa;
      merged.guru=Array.isArray(db.guru)?db.guru:base.guru;
      merged.users=Array.isArray(db.users)?db.users:base.users;
      merged.kelas=Array.isArray(db.kelas)?db.kelas:base.kelas;
      merged.mapel=Array.isArray(db.mapel)?db.mapel:base.mapel;
      merged.jadwal=Array.isArray(db.jadwal)?db.jadwal:base.jadwal;
      merged.produk=Array.isArray(db.produk)?db.produk:base.produk;
      merged.absensiSiswa=Array.isArray(db.absensiSiswa)?db.absensiSiswa:base.absensiSiswa;
      merged.absensiGuru=Array.isArray(db.absensiGuru)?db.absensiGuru:base.absensiGuru;
      merged.absensiMapel=Array.isArray(db.absensiMapel)?db.absensiMapel:base.absensiMapel;
      merged.pembayaran=Array.isArray(db.pembayaran)?db.pembayaran:base.pembayaran;
      merged.kantin=Array.isArray(db.kantin)?db.kantin:base.kantin;
      merged.capaian=Array.isArray(db.capaian)?db.capaian:base.capaian;
      merged.notifications=Array.isArray(db.notifications)?db.notifications:base.notifications;
      merged.years=Array.isArray(db.years)?db.years:base.years;
      merged.settings={...base.settings,...(db.settings||{})};

      if(!merged.absensiSiswa.length){
        const t=today();
        merged.absensiSiswa=merged.siswa.map((s,i)=>({id:uid(),tanggal:t,siswaId:s.id,status:i%5===0?'Izin':i%6===0?'Sakit':'Hadir',ket:''}));
      }
      if(!merged.absensiGuru.length){
        const t=today();
        merged.absensiGuru=merged.guru.map((g,i)=>({id:uid(),tanggal:t,guruId:g.id,status:i===2?'Terlambat':'Hadir',jamDatang:i===2?'07:12':'06:55',ket:''}));
      }
      if(!merged.absensiMapel.length){
        merged.absensiMapel=[
          {id:uid(),tanggal:today(),kelas:'1A',jam:'07:00',mapel:'Al-Qur\'an (Tahfidz)',guruId:'g5',siswaId:'s1',status:'Hadir'},
          {id:uid(),tanggal:today(),kelas:'1A',jam:'07:00',mapel:'Al-Qur\'an (Tahfidz)',guruId:'g5',siswaId:'s2',status:'Hadir'},
          {id:uid(),tanggal:today(),kelas:'1A',jam:'07:35',mapel:'Matematika',guruId:'g1',siswaId:'s1',status:'Hadir'}
        ];
      }
      if(!merged.kantin.length){
        merged.kantin=[
          {id:uid(),siswaId:'s1',tanggal:today(),waktu:'06:50:00',keterangan:'Top Up Saldo',nominal:50000,metode:'Top Up'},
          {id:uid(),siswaId:'s1',tanggal:today(),waktu:'09:40:00',keterangan:'Nasi Ayam + Air Mineral',nominal:-12000,metode:'Saldo'},
          {id:uid(),siswaId:'s2',tanggal:today(),waktu:'06:52:00',keterangan:'Top Up Saldo',nominal:30000,metode:'Top Up'},
          {id:uid(),siswaId:'s2',tanggal:today(),waktu:'09:42:00',keterangan:'Roti + Susu',nominal:-8000,metode:'Saldo'}
        ];
      }
      if(!merged.pembayaran.length){
        merged.pembayaran=[
          {id:uid(),siswaId:'s1',jenis:'SPP Bulan Ini',nominal:150000,jatuhTempo:today(),status:'Belum Lunas',tanggalBayar:null},
          {id:uid(),siswaId:'s1',jenis:'Seragam Sekolah',nominal:350000,jatuhTempo:today(),status:'Lunas',tanggalBayar:today()},

      if(!merged.capaian.length){
        merged.capaian=[
          {id:uid(),siswaId:'s1',mapel:'Matematika',materi:'Penjumlahan 1-20',nilai:92,catatan:'Sudah baik',tanggal:today()},

          {id:uid(),siswaId:'s2',mapel:"Al-Qur'an (Tahfidz)",materi:'Juz 30',nilai:95,catatan:'Sangat baik',tanggal:today()}

        merged.notifications=[

      merged.settings.limitHarian=Number(merged.settings.limitHarian||20000);

      return merged;

    const db=loadDb();
    let currentUser=null; let currentView='dashboard';
    const state={
      absenTanggal: today(), absenKelas: '1A', dateFrom: dayBack(30), dateTo: today(), capaianSiswa:'s1',
      notifFilter:'all'
    };

    function saveDb(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
    function getSiswa(id){ return db.siswa.find(s=>s.id===id); }
    function getGuru(id){ return db.guru.find(g=>g.id===id); }
    function getUser(id){ return db.users.find(u=>u.id===id); }
    function kelasList(){ return [...new Set(db.kelas.map(k=>k.nama))].sort(); }
    function saldoSiswa(sid){ return db.kantin.filter(k=>k.siswaId===sid && k.metode!=='Cash').reduce((sum,k)=>sum+Number(k.nominal||0),0); }
    function getUserByLogin(u){ return db.users.find(x=>x.u===u); }
    function limitSiswa(s){ return s && s.limit ? s.limit : (db.settings && db.settings.limitHarian ? db.settings.limitHarian : 20000); }
    function validasiBelanja(siswaId,total,metode='Saldo'){ const s=getSiswa(siswaId); const used=db.kantin.filter(k=>k.siswaId===siswaId && k.tanggal===today() && k.nominal<0).reduce((sum,k)=>sum+Math.abs(Number(k.nominal||0)),0); const limit=limitSiswa(s); const saldo=saldoSiswa(siswaId); if(total > (limit - used)) return {ok:false,msg:`Limit harian terlampaui. Sisa limit: ${money(limit - used)}.`}; if(metode==='Saldo' && saldo < total) return {ok:false,msg:`Saldo tidak cukup. Saldo saat ini: ${money(saldo)}.`}; return {ok:true}; }

    function persistSession(user){ if(!user){ sessionStorage.removeItem(SESSION_KEY); return; } sessionStorage.setItem(SESSION_KEY, JSON.stringify({u:user.u,role:user.role})); }
    function toast(msg,err=false){ const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(), err?2800:2000); }

    function qrSvg(text){
      try {
        const q = qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(); let path='';
        for(let y=0;y<n;y++){ for(let x=0;x<n;x++){ if(q.isDark(y,x)) path += `M${x},${y}h1v1h-1z`; } }
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff" /><path d="${path}" fill="#000" /></svg>`;
      } catch { return `<div style="padding:8px;font-size:10px;color:#b4252a;">QR Error</div>`; }
    }

      const siswaOptions=db.siswa.map(s=>`<option value="${s.id}">${esc(s.nama)} • ${s.kelas}</option>`).join('');

    function saveKasir(){ const siswaId=$('#kasirSiswa').value; const produkId=$('#kasirProduk').value; const metode=$('#kasirMetode').value; const qty=Number($('#kasirQty').value||1); const product=db.produk.find(p=>p.id===produkId); if(!product){ toast('Produk tidak ditemukan',true); return; } const total=product.harga * qty; const valid=validasiBelanja(siswaId,total,metode); if(!valid.ok){ toast(valid.msg,true); return; } db.kantin.push({id:uid(),siswaId,tanggal:today(),waktu:new Date().toTimeString().slice(0,8),keterangan:`${qty} x ${product.nama}`,nominal:metode==='Top Up'?total:-total,metode:metode==='Top Up'?'Top Up':'Saldo'}); if(typeof product.stok==='number'){ product.stok = Math.max(0, Number(product.stok) - qty); } saveDb(); toast('Transaksi kasir disimpan'); renderView(); }

    function renderImport(){
      return `<div class="card"><div class="card-head"><div><h3>Impor Massal Siswa dari Excel / CSV</h3><p>Format kolom: nama,nis,kelas,ortu,kontak,alamat,ttl</p></div></div><div class="form-grid"><div class="field"><label>Upload File</label><input id="csvFile" type="file" accept=".csv,.txt" class="hidden" /><button class="btn btn-primary" id="importCsvBtn">Pilih CSV</button></div></div><div style="margin-top:14px; color:var(--muted);">Contoh CSV:<br><code>nama,nis,kelas,ortu,kontak,alamat,ttl<br>Ahmad Fauzan,2425001,1A,Bapak Hasan,0812...,Jl. Tegir,2017-03-12</code></div></div>`; }
    function handleCsvImport(e){ const file=e.target.files&&e.target.files[0]; if(!file){ return; } const reader=new FileReader(); reader.onload=()=>{ const text=String(reader.result||''); const rows=text.split(/\r?\n/).map(r=>r.trim()).filter(Boolean); if(rows.length<2){ toast('CSV kosong atau tidak valid',true); return; } const header=rows[0].split(',').map(v=>v.trim().toLowerCase()); const newStudents=[]; for(let i=1;i<rows.length;i++){ const cols=rows[i].split(',').map(v=>v.trim()); const obj={}; header.forEach((h,idx)=>obj[h]= (cols[idx] || '').trim()); if(!obj.nama || !obj.nis) continue; newStudents.push({id:uid(), nama:obj.nama, nis:obj.nis, kelas:obj.kelas||'1A', ortu:obj.ortu||'', kontak:obj.kontak||'', alamat:obj.alamat||'', ttl:obj.ttl||'', foto:''}); }
      if(!newStudents.length){ toast('Tidak ada siswa yang bisa diimpor',true); return; }
      db.siswa.push(...newStudents); saveDb(); toast(`${newStudents.length} siswa berhasil diimpor`); renderView(); };
      reader.readAsText(file);
    }

    });

    document.addEventListener('change',(e)=>{
      if(e.target && e.target.id==='csvFile'){ handleCsvImport(e); }
      if(e.target && e.target.id==='capaianSelect'){ state.capaianSiswa=e.target.value; renderView(); }
      if(e.target && e.target.id==='absenSiswaDate'){ state.absenTanggal=e.target.value || today(); }
      if(e.target && e.target.id==='absenSiswaKelas'){ state.absenKelas=e.target.value; renderView(); }
      if(e.target && e.target.id==='absenGuruDate'){ state.absenTanggal=e.target.value || today(); }
      if(e.target && e.target.id==='rekapFrom'){ state.dateFrom=e.target.value || dayBack(30); }
      if(e.target && e.target.id==='rekapTo'){ state.dateTo=e.target.value || today(); }
    });

    document.addEventListener('click', e=>{
      const t=e.target.closest('.edit-siswa'); if(t){ loadStudentForm(t.dataset.id); }
      const u=e.target.closest('.edit-guru'); if(u){ loadGuruForm(u.dataset.id); }
      const v=e.target.closest('.edit-user'); if(v){ loadUserForm(v.dataset.id); }
      const w=e.target.closest('.edit-kelas'); if(w){ loadKelasForm(w.dataset.id); }
      const x=e.target.closest('.edit-mapel'); if(x){ loadMapelForm(x.dataset.id); }
      const y=e.target.closest('.edit-jadwal'); if(y){ loadJadwalForm(y.dataset.id); }
      const z=e.target.closest('.edit-produk'); if(z){ loadProdukForm(z.dataset.id); }
      const d1=e.target.closest('.delete-siswa'); if(d1 && confirm('Hapus siswa ini?')){ db.siswa=db.siswa.filter(s=>s.id!==d1.dataset.id); saveDb(); renderView(); }
      const d2=e.target.closest('.delete-guru'); if(d2 && confirm('Hapus guru ini?')){ db.guru=db.guru.filter(g=>g.id!==d2.dataset.id); saveDb(); renderView(); }
      const d3=e.target.closest('.delete-user'); if(d3 && confirm('Hapus user ini?')){ db.users=db.users.filter(u=>u.id!==d3.dataset.id); saveDb(); renderView(); }
      const d4=e.target.closest('.delete-kelas'); if(d4 && confirm('Hapus kelas ini?')){ db.kelas=db.kelas.filter(k=>k.id!==d4.dataset.id); saveDb(); renderView(); }
      const d5=e.target.closest('.delete-mapel'); if(d5 && confirm('Hapus mapel ini?')){ db.mapel=db.mapel.filter(m=>m.id!==d5.dataset.id); saveDb(); renderView(); }
      const d6=e.target.closest('.delete-jadwal'); if(d6 && confirm('Hapus jadwal ini?')){ db.jadwal=db.jadwal.filter(j=>j.id!==d6.dataset.id); saveDb(); renderView(); }
      const d7=e.target.closest('.delete-produk'); if(d7 && confirm('Hapus produk ini?')){ db.produk=db.produk.filter(p=>p.id!==d7.dataset.id); saveDb(); renderView(); }
      const n=e.target.closest('.send-notif'); if(n){ triggerNotification(n.dataset.type, n.dataset.msg, n.dataset.target); }
      const c=e.target.closest('.clear-notif'); if(c){ db.notifications=db.notifications.filter(nf=>nf.id!==c.dataset.id); saveDb(); renderView(); }
      const r=e.target.closest('#resetPwdBtn'); if(r){ const uid=r.dataset.id; const u=db.users.find(x=>x.id===uid); if(u){ u.p='123456'; saveDb(); toast(`Password ${u.u} direset ke 123456`); renderView(); } }
    });

    init();
  </script>
</body>
</html>
