<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SD Program Unggulan Assunniyyah</title>
  <style>
    :root {
      --primary: #0b6b3a;
      --primary-dark: #084d2a;
      --primary-soft: #eaf6ef;
      --gold: #d9a419;
      --bg: #f4f7f4;
      --white: #ffffff;
      --text: #173127;
      --muted: #62766c;
      --line: #dfe7e2;
      --danger: #c0392b;
      --warn: #df8a0d;
      --success: #1d7a4b;
      --shadow: 0 10px 24px rgba(11, 107, 58, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    body { min-height: 100vh; }
    button, input, select { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 15% 20%, rgba(18,138,76,0.26), transparent 42%),
                  radial-gradient(circle at 85% 80%, rgba(217,164,25,0.18), transparent 38%),
                  linear-gradient(140deg, var(--primary), var(--primary-dark));
    }

    .login-card {
      width: min(100%, 430px);
      background: #fff;
      border-radius: 20px;
      padding: 30px 28px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.28);
    }

    .login-logo {
      width: 72px; height: 72px; border-radius: 50%;
      display: grid; place-items: center; font-size: 34px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      margin: 0 auto 14px; color: #fff;
      box-shadow: 0 10px 24px rgba(11,107,58,0.38);
    }

    h1 { margin: 0; font-size: 1.2rem; text-align: center; color: var(--primary); }
    .subtitle { margin: 8px 0 18px; text-align: center; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }

    label { display: block; margin: 12px 0 6px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    input, select {
      width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; background: #fbfdfc; color: var(--text);
      outline: none; transition: 0.18s ease;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(18,138,76,0.12); }

    .btn { border: 0; border-radius: 10px; cursor: pointer; padding: 10px 16px; font-weight: 700; transition: 0.15s ease; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: white; border: 1.5px solid var(--line); color: var(--text); }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
    .btn-danger { background: #fdeceb; color: var(--danger); border: 1.5px solid #f7d4d1; }
    .btn-gold { background: var(--gold); color: #3d2e00; }
    .btn-sm { padding: 7px 10px; font-size: 0.75rem; border-radius: 8px; }
    .full { width: 100%; }

    .demo-box {
      background: var(--primary-soft); border: 1px solid rgba(11,107,58,0.08); border-radius: 12px; padding: 12px 14px; margin-top: 18px;
    }
    .demo-box strong { display: block; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); margin-bottom: 6px; }
    .demo-row { display: flex; justify-content: space-between; font-size: 0.75rem; gap: 12px; color: var(--text); padding: 5px 0; }
    .demo-row code { background: white; color: var(--primary); font-weight: 700; border-radius: 6px; padding: 2px 7px; }
    .demo-note { margin-top: 12px; text-align: center; color: var(--muted); font-size: 0.72rem; }

    .app {
      display: flex; min-height: 100vh;
    }
    .sidebar {
      width: 250px; background: linear-gradient(180deg, var(--primary), var(--primary-dark)); color: #f2f9f4;
      padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px 16px; border-bottom: 1px solid rgba(255,255,255,0.18); margin-bottom: 12px; }
    .brand-mark { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.12); display: grid; place-items: center; }
    .brand-title { font-size: 0.82rem; font-weight: 800; }
    .brand-sub { font-size: 0.68rem; opacity: 0.8; }
    .nav { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .nav-btn {
      width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-radius: 10px; background: transparent; color: inherit; padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 0.8rem;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.08); }
    .nav-btn.active { background: white; color: var(--primary); }
    .nav-icon { width: 18px; text-align: center; }
    .sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.18); padding-top: 12px; margin-top: 8px; }

    .main { flex: 1; min-width: 0; }
    .topbar {
      background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10; backdrop-filter: blur(6px);
    }
    .topbar h2 { margin: 0; color: var(--primary); font-size: 1rem; }
    .topbar .sub { margin-top: 2px; color: var(--muted); font-size: 0.72rem; }
    .userbox { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 800; display: grid; place-items: center; }
    .user-meta { display: flex; flex-direction: column; }
    .user-name { font-size: 0.78rem; font-weight: 700; }
    .user-role { font-size: 0.64rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .content-shell { padding: 22px 24px 40px; }

    .section-grid { display: grid; gap: 16px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .stat, .card {
      background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .stat { padding: 16px 18px; position: relative; overflow: hidden; }
    .stat::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--primary); }
    .stat.gold::before { background: var(--gold); }
    .stat.warn::before { background: var(--warn); }
    .stat.danger::before { background: var(--danger); }
    .stat-label { font-size: 0.68rem; font-weight: 800; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
    .stat-value { margin-top: 8px; font-size: clamp(1.5rem, 2vw, 2rem); font-weight: 800; letter-spacing: -0.04em; }
    .stat-hint { margin-top: 6px; font-size: 0.7rem; color: var(--muted); }

    .card { padding: 18px 18px 12px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .card-head h3 { margin: 0; color: var(--primary); font-size: 0.98rem; }
    .card-head p { margin: 3px 0 0; color: var(--muted); font-size: 0.72rem; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #edf1ef; text-align: left; }
    th { background: #f5f9f6; color: #375446; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; }
    td { font-size: 0.77rem; }
    tbody tr:hover { background: #fafdfb; }

    .table-wrap { overflow-x: auto; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
    .pill.hadir { background: #e7f7ee; color: var(--success); }
    .pill.sakit { background: #fff0d5; color: #a36200; }
    .pill.izin { background: #eaf0ff; color: #2b5bbd; }
    .pill.alpa { background: #fdeceb; color: var(--danger); }
    .pill.late { background: #fff0d5; color: #9d6800; }
    .pill.lunas { background: #e7f7ee; color: var(--success); }
    .pill.belum { background: #fdeceb; color: var(--danger); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { margin: 0; }

    .list { display: grid; gap: 10px; }
    .list-item { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid #edf1ef; padding-bottom: 8px; }
    .list-item:last-child { border-bottom: none; padding-bottom: 0; }
    .list-title { font-weight: 700; }
    .list-meta { color: var(--muted); font-size: 0.7rem; margin-top: 3px; }
    .empty { text-align: center; color: var(--muted); padding: 30px 12px; font-size: 0.78rem; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .space-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; padding: 4px 8px; border-radius: 999px; font-size: 0.68rem; font-weight: 800; background: var(--primary-soft); color: var(--primary); }
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .qr-card-box {
      border: 1px dashed #9cb0a4; border-radius: 12px; padding: 12px; background: white; text-align: center;
    }
    .qr-box { width: 110px; height: 110px; margin: 0 auto 8px; display: grid; place-items: center; }
    .qr-box svg { width: 100%; height: 100%; display: block; }
    .qr-name { font-weight: 700; font-size: 0.8rem; }
    .qr-code { color: var(--muted); font-size: 0.7rem; }

    .toast {
      position: fixed; right: 18px; bottom: 18px; background: var(--primary); color: white; border-radius: 12px; box-shadow: 0 12px 28px rgba(11,107,58,0.25);
      padding: 11px 16px; font-size: 0.8rem; font-weight: 700; z-index: 999; animation: fadeUp 0.25s ease;
    }
    .toast.err { background: var(--danger); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }

    @media (max-width: 900px) {
      .app { display: block; }
      .sidebar { width: 100%; height: auto; position: static; padding: 12px; }
      .nav { flex-direction: row; flex-wrap: wrap; }
      .nav-btn { width: auto; flex: 1 1 auto; }
      .topbar { padding: 12px 14px; }
      .content-shell { padding: 16px 14px 26px; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .grid-4 { grid-template-columns: 1fr; }
      .login-card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const STORAGE_KEY = 'assunniyyah_demo_db_v2';
    const SESSION_KEY = 'assunniyyah_demo_session';

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));
    const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
    const pad = (n) => String(n).padStart(2, '0');
    const today = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    };
    const dayBack = (days) => {
      const d = new Date(); d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    };
    const money = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
    const fmtDate = (s) => {
      if (!s) return '-';
      const d = new Date(`${s}T00:00:00`);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    };
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));

    function safeParse(raw, fallback) {
      try {
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function normaliseDB(raw) {
      const base = { 
        siswa: [
          { id: 's1', nis: '2425001', nama: 'Ahmad Fauzan', kelas: '1A', wali: 'Bapak Hasan' },
          { id: 's2', nis: '2425002', nama: 'Aisyah Nur Fadhilah', kelas: '1A', wali: 'Bapak Rahman' },
          { id: 's3', nis: '2425003', nama: 'Bilal Ramadhan', kelas: '1A', wali: 'Bapak Yusuf' },
          { id: 's4', nis: '2425004', nama: 'Citra Aulia', kelas: '1A', wali: 'Bapak Ibrahim' },
          { id: 's5', nis: '2425005', nama: 'Dimas Prayoga', kelas: '2A', wali: 'Bapak Soleh' },
          { id: 's6', nis: '2425006', nama: 'Eka Putri Ramadhani', kelas: '2A', wali: 'Bapak Anwar' },
          { id: 's7', nis: '2425007', nama: 'Farhan Maulana', kelas: '2A', wali: 'Bapak Ridwan' },
          { id: 's8', nis: '2425008', nama: 'Gita Safira', kelas: '3A', wali: 'Bapak Zainal' },
          { id: 's9', nis: '2425009', nama: 'Hafiz Alfarizi', kelas: '3A', wali: 'Bapak Munir' },
          { id: 's10', nis: '2425010', nama: 'Indah Permata Sari', kelas: '3A', wali: 'Bapak Salim' },
          { id: 's11', nis: '2425011', nama: 'Joko Prasetyo', kelas: '4A', wali: 'Bapak Sugeng' },
          { id: 's12', nis: '2425012', nama: 'Kholifah Aulia', kelas: '4A', wali: 'Bapak Amir' },
        ],
        guru: [
          { id: 'g1', nama: 'Ustadzah Nur Aisyah', mapel: 'Guru Kelas 1A' },
          { id: 'g2', nama: 'Ustadz Ahmad Fauzi', mapel: 'Guru Kelas 2A' },
          { id: 'g3', nama: 'Ustadzah Siti Maryam', mapel: 'Guru Kelas 3A' },
          { id: 'g4', nama: 'Ustadz Hasan Basri', mapel: 'Guru PAI' },
          { id: 'g5', nama: 'Ustadzah Laila Kurnia', mapel: 'Guru Tahfidz' },
          { id: 'g6', nama: 'Ustadz Rizal Hakim', mapel: 'Guru Olahraga' },
        ],
        users: [
          { u: 'admin', p: 'admin123', role: 'admin', nama: 'Administrator Sekolah', ref: null },
          { u: 'guru', p: 'guru123', role: 'guru', nama: 'Ustadzah Nur Aisyah', ref: 'g1' },
          { u: 'wali', p: 'wali123', role: 'wali', nama: 'Bapak Hasan', ref: 's1' },
          { u: 'kantin', p: 'kantin123', role: 'kantin', nama: 'Petugas Kantin', ref: null }
        ],
        absensiSiswa: [],
        absensiGuru: [],
        pembayaran: [],
        kantin: [],
        capaian: [],
        produk: [
          { id: 'p1', kode: 'BRG-001', nama: 'Nasi Ayam', harga: 10000 },
          { id: 'p2', kode: 'BRG-002', nama: 'Mie Ayam', harga: 8000 },
          { id: 'p3', kode: 'BRG-003', nama: 'Bakso', harga: 8000 },
          { id: 'p4', kode: 'BRG-004', nama: 'Air Mineral', harga: 3000 },
          { id: 'p5', kode: 'BRG-005', nama: 'Es Teh', harga: 3000 },
          { id: 'p6', kode: 'BRG-006', nama: 'Susu Kotak', harga: 5000 },
          { id: 'p7', kode: 'BRG-007', nama: 'Roti', harga: 4000 },
          { id: 'p8', kode: 'BRG-008', nama: 'Snack Ringan', harga: 2000 },
        ],
        absensiMapel: [],
        settings: { limitHarian: 20000, version: 2 }
      };

      const data = raw && typeof raw === 'object' ? raw : {};
      const result = {
        ...base,
        ...data,
        siswa: Array.isArray(data.siswa) ? data.siswa : base.siswa,
        guru: Array.isArray(data.guru) ? data.guru : base.guru,
        users: Array.isArray(data.users) ? data.users : base.users,
        absensiSiswa: Array.isArray(data.absensiSiswa) ? data.absensiSiswa : base.absensiSiswa,
        absensiGuru: Array.isArray(data.absensiGuru) ? data.absensiGuru : base.absensiGuru,
        pembayaran: Array.isArray(data.pembayaran) ? data.pembayaran : base.pembayaran,
        kantin: Array.isArray(data.kantin) ? data.kantin : base.kantin,
        capaian: Array.isArray(data.capaian) ? data.capaian : base.capaian,
        produk: Array.isArray(data.produk) ? data.produk : base.produk,
        absensiMapel: Array.isArray(data.absensiMapel) ? data.absensiMapel : base.absensiMapel,
        settings: { ...base.settings, ...(data.settings || {}) }
      };

      if (!result.absensiSiswa.length) {
        const t = today();
        result.absensiSiswa = result.siswa.map((s, i) => ({
          id: uid(), tanggal: t, siswaId: s.id,
          status: i % 5 === 0 ? 'Izin' : i % 6 === 0 ? 'Sakit' : 'Hadir',
          ket: ''
        }));
      }
      if (!result.absensiGuru.length) {
        const t = today();
        result.absensiGuru = result.guru.map((g, i) => ({
          id: uid(), tanggal: t, guruId: g.id,
          status: i === 2 ? 'Terlambat' : 'Hadir',
          jamDatang: i === 2 ? '07:12' : '06:55',
          ket: ''
        }));
      }
      if (!result.pembayaran.length) {
        result.siswa.forEach((s, i) => {
          result.pembayaran.push({ id: uid(), siswaId: s.id, jenis: 'SPP Bulan Ini', nominal: 150000, jatuhTempo: today(), status: i % 3 === 0 ? 'Belum Lunas' : 'Lunas', tanggalBayar: i % 3 === 0 ? null : today() });
          result.pembayaran.push({ id: uid(), siswaId: s.id, jenis: 'Seragam Sekolah', nominal: 350000, jatuhTempo: today(), status: i % 4 === 0 ? 'Belum Lunas' : 'Lunas', tanggalBayar: i % 4 === 0 ? null : today() });
        });
      }
      if (!result.kantin.length) {
        result.kantin = [
          { id: uid(), siswaId: 's1', tanggal: today(), waktu: '06:50:00', keterangan: 'Top Up Saldo', nominal: 50000, metode: 'Top Up' },
          { id: uid(), siswaId: 's1', tanggal: today(), waktu: '09:40:00', keterangan: 'Nasi Ayam + Air Mineral', nominal: -12000, metode: 'Saldo' },
          { id: uid(), siswaId: 's2', tanggal: today(), waktu: '06:52:00', keterangan: 'Top Up Saldo', nominal: 30000, metode: 'Top Up' },
          { id: uid(), siswaId: 's2', tanggal: today(), waktu: '09:42:00', keterangan: 'Roti + Susu', nominal: -8000, metode: 'Saldo' },
        ];
      }
      if (!result.capaian.length) {
        result.capaian = [
          { id: uid(), siswaId: 's1', mapel: 'Matematika', materi: 'Penjumlahan 1-20', nilai: 92, catatan: 'Sudah baik', tanggal: today() },
          { id: uid(), siswaId: 's1', mapel: 'Bahasa Indonesia', materi: 'Membaca permulaan', nilai: 88, catatan: 'Membaca lancar', tanggal: today() },
          { id: uid(), siswaId: 's2', mapel: 'Al-Qur\'an (Tahfidz)', materi: 'Juz 30', nilai: 95, catatan: 'Sangat baik', tanggal: today() }
        ];
      }

      result.settings.limitHarian = Number(result.settings.limitHarian || 20000);
      result.settings.version = 2;
      return result;
    }

    const db = normaliseDB(safeParse(localStorage.getItem(STORAGE_KEY), null));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));

    let currentUser = null;
    let currentView = 'dashboard';

    const state = {
      absenTanggal: today(),
      absenKelas: '1A',
      dateFrom: dayBack(30),
      dateTo: today(),
      qrKelas: 'Semua',
      capaianSiswa: 's1',
      scan: { kelas: '1A', jam: 1, mapel: 'Matematika' }
    };

    const DEMO_USERS = [
      { username: 'admin', password: 'admin123', label: 'Admin / Lembaga' },
      { username: 'guru', password: 'guru123', label: 'Guru' },
      { username: 'wali', password: 'wali123', label: 'Wali Murid' },
      { username: 'kantin', password: 'kantin123', label: 'Petugas Kantin' }
    ];

    function saveDB() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function getSiswa(id) { return db.siswa.find((s) => s.id === id); }
    function getGuru(id) { return db.guru.find((g) => g.id === id); }
    function kelasList() { return [...new Set(db.siswa.map((s) => s.kelas))].sort(); }
    function saldoSiswa(sid) {
      return db.kantin
        .filter((k) => k.siswaId === sid && k.metode !== 'Cash')
        .reduce((sum, k) => sum + Number(k.nominal || 0), 0);
    }
    function limitSiswa(s) {
      return s && s.limit ? s.limit : (db.settings && db.settings.limitHarian ? db.settings.limitHarian : 20000);
    }

    function getSessionUser() {
      const raw = safeParse(sessionStorage.getItem(SESSION_KEY), null);
      if (!raw || !raw.u) return null;
      return db.users.find((u) => u.u === raw.u && u.role === raw.role) || null;
    }

    function persistSession(user) {
      if (!user) {
        sessionStorage.removeItem(SESSION_KEY);
        return;
      }
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ u: user.u, role: user.role }));
    }

    function toast(msg, err = false) {
      const el = document.createElement('div');
      el.className = `toast${err ? ' err' : ''}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), err ? 2800 : 2000);
    }

    function qrSvg(text) {
      try {
        const q = qrcode(0, 'M'); q.addData(text); q.make();
        const n = q.getModuleCount();
        let path = '';
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            if (q.isDark(y, x)) path += `M${x},${y}h1v1h-1z`;
          }
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff" /><path d="${path}" fill="#000" /></svg>`;
      } catch {
        return `<div style="padding:8px;font-size:10px;color:#b4252a;">QR Error</div>`;
      }
    }

    function validasiBelanja(siswaId, total, metode) {
      const s = getSiswa(siswaId);
      const used = db.kantin.filter((k) => k.siswaId === siswaId && k.tanggal === today() && k.nominal < 0).reduce((sum, k) => sum + Math.abs(k.nominal), 0);
      const limit = limitSiswa(s);
      const saldo = saldoSiswa(siswaId);
      if (total > (limit - used)) {
        return { ok: false, msg: `Limit harian terlampaui. Sisa limit: ${money(limit - used)}.` };
      }
      if (metode === 'Saldo' && saldo < total) {
        return { ok: false, msg: `Saldo tidak cukup. Saldo saat ini: ${money(saldo)}.` };
      }
      return { ok: true };
    }

          <div class="table-wrap">
            <table>
              <thead><tr><th>Siswa</th><th>Kelas</th><th>Jenis</th><th>Nominal</th><th>Status</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderKantin() {
      const rows = db.kantin.slice().reverse().map((k) => {
        const siswa = getSiswa(k.siswaId);
        return `
          <tr>
            <td>${esc(siswa?.nama || '-')}</td>
            <td>${esc(k.keterangan)}</td>
            <td>${esc(k.metode)}</td>
            <td>${fmtDate(k.tanggal)}</td>
            <td style="color:${k.nominal < 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">${k.nominal < 0 ? '-' : '+'}${money(Math.abs(k.nominal))}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="card">
          <div class="card-head">
            <div>
              <h3>Riwayat Kantin</h3>
              <p>Semua transaksi</p>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Siswa</th><th>Keterangan</th><th>Metode</th><th>Tanggal</th><th>Nominal</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderQrBarang() {
      const cards = db.produk.map((p) => `
        <div class="qr-card-box">
          <div class="qr-box">${qrSvg(`${p.kode}`)}</div>
          <div class="qr-name">${esc(p.nama)}</div>
          <div class="qr-code">${esc(p.kode)} • ${money(p.harga)}</div>
        </div>
      `).join('');

      return `
        <div class="card">
          <div class="card-head">
            <div>
              <h3>Daftar QR Barang Kantin</h3>
              <p>Gunakan untuk kasir</p>
            </div>
          </div>
          <div class="qr-grid">${cards}</div>
        </div>
      `;
    }

    function renderCapaian() {
      const siswa = db.siswa.filter((s) => s.id === state.capaianSiswa || s.id === currentUser.ref || !currentUser.ref);
      const options = db.siswa.map((s) => `<option value="${s.id}" ${s.id === state.capaianSiswa ? 'selected' : ''}>${esc(s.nama)} • ${s.kelas}</option>`).join('');
      const rows = db.capaian.filter((c) => c.siswaId === (state.capaianSiswa || currentUser.ref || db.siswa[0].id)).map((c) => `
        <tr>
          <td>${esc(c.mapel)}</td>
          <td>${esc(c.materi)}</td>
          <td>${c.nilai}</td>
          <td>${esc(c.catatan)}</td>
        </tr>
      `).join('');

      return `
        <div class="card">
          <div class="card-head">
            <div>
              <h3>Capaian Belajar</h3>
              <p>Per siswa</p>
            </div>
          </div>
          <div class="field" style="margin-bottom:16px; max-width:300px;">
            <label>Pilih Siswa</label>
            <select id="capaianSelect">${options}</select>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Mapel</th><th>Materi</th><th>Nilai</th><th>Catatan</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="4"><div class="empty">Belum ada capaian</div></td></tr>'}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderKasir() {
      const siswaOptions = db.siswa.map((s) => `<option value="${s.id}">${esc(s.nama)} • ${s.kelas}</option>`).join('');
      const produkOptions = db.produk.map((p) => `<option value="${p.id}">${esc(p.nama)} • ${money(p.harga)}</option>`).join('');
      return `
        <div class="section-grid grid-2">
          <div class="card">
            <div class="card-head">
              <div><h3>Transaksi Kasir</h3><p>Penjualan produk</p></div>
            </div>
            <div class="form-grid">
              <div class="field"><label>Siswa</label><select id="kasirSiswa">${siswaOptions}</select></div>
              <div class="field"><label>Produk</label><select id="kasirProduk">${produkOptions}</select></div>
              <div class="field"><label>Metode</label><select id="kasirMetode"><option>Saldo</option><option>Top Up</option></select></div>
              <div class="field"><label>Jumlah</label><input id="kasirQty" type="number" min="1" value="1" /></div>
              <div class="field" style="grid-column: 1 / -1;"><button class="btn btn-primary full" id="saveKasirTrx">Simpan Transaksi</button></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head">
              <div><h3>Ringkasan Hari Ini</h3><p>Saldo & transaksi</p></div>
            </div>
            <div class="list">
              ${db.siswa.slice(0, 4).map((s) => `
                <div class="list-item">
                  <div>
                    <div class="list-title">${esc(s.nama)}</div>
                    <div class="list-meta">${s.kelas}</div>
                  </div>
                  <strong>${money(saldoSiswa(s.id))}</strong>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function init() {
      const savedUser = getSessionUser();
      currentUser = savedUser;
      if (currentUser) {
        currentView = 'dashboard';
        renderApp();
      } else {
        renderLogin();
      }

      document.addEventListener('change', (e) => {
        if (e.target && e.target.id === 'capaianSelect') {
          state.capaianSiswa = e.target.value;
          renderTampilan();
        }
        if (e.target && e.target.id === 'rekapFrom') state.dateFrom = e.target.value || dayBack(30);
        if (e.target && e.target.id === 'rekapTo') state.dateTo = e.target.value || today();
        if (e.target && e.target.id === 'applyRekap') {
          if (state.dateFrom && state.dateTo && state.dateFrom > state.dateTo) {
            toast('Rentang tanggal tidak valid', true);
            return;
          }
          renderTampilan();
        }
      });
    }

    init();
  </script>
</body>
</html>
